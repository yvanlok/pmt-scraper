[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "pmt-scraper"
version = "0.1.0"
description = "Download and organise PDFs from Physics & Maths Tutor pages"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["pmt", "physics", "maths", "tutor", "pdf", "scraper", "revision"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Environment :: Console",
    "Topic :: Education",
]
dependencies = [
    "requests",
    "beautifulsoup4",
]

[project.urls]
Homepage = "https://github.com/yourusername/pmt-scraper"

[project.scripts]
pmt-scrape = "pmt_scraper.cli:main"
